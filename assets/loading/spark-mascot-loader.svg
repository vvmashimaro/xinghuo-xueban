  <style>
    .glow {
      transform-origin: 64px 70px;
      animation: glowPulse 1.35s ease-in-out infinite;
    }
    .mascot {
      transform-origin: 64px 70px;
      animation: breathe 1.35s ease-in-out infinite;
    }
    .spark {
      transform-origin: center;
      animation: twinkle 1.8s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(0.94); }
      50% { transform: scale(1.06); }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.28; transform: scale(0.92); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .glow, .mascot, .spark { animation: none; }
    }
  </style>
