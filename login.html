<!DOCTYPE html>
<html lang="zh-CN" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>[data-warehouse-only].hidden,[data-warehouse-off].hidden,[data-contract-iot-clause].hidden,[data-contract-warehouse-clause].hidden,#bookingSuccessSimple.hidden,#bookingSuccessWarehouse.hidden{display:none!important}</style>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>星火学伴 - 极简登录与认证中心</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/xinghuo-tokens.css">
  <script src="js/tailwind-brand.js"></script>
  <script>tailwind.config = window.XH_TAILWIND_CONFIG;</script>
  <style>
    .field-soft {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .field-soft:focus {
      background: rgba(255, 255, 255, 0.55);
    }
    /* 复选/单选选项字号加大，便于阅读 */
    label:has(> input[type="checkbox"]),
    label:has(> input[type="radio"]),
    label.subject-tag,
    .opt-chip-label,
    .filter-tab {
      font-size: 16px !important;
      line-height: 1.4;
    }
    label:has(> input[type="checkbox"]) span,
    label:has(> input[type="radio"]) span,
    label.subject-tag span {
      font-size: 16px !important;
      line-height: 1.4;
    }
    input[type="checkbox"] + span,
    input[type="checkbox"] ~ span {
      font-size: 16px !important;
      line-height: 1.45;
    }
    #subjectCheckboxGroup label {
      font-size: 16px !important;
    }
  </style>
</head>
<body class="xh-shell-bg text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-brand-100 selection:text-brand-900 relative overflow-x-hidden max-w-[100vw]">

  <!-- 背景光影装饰 -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0" aria-hidden="true">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-brand-400/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-brand-lavender/30 rounded-full blur-3xl"></div>
  </div>

  <!-- 顶部轻量系统栏：左侧品牌，右侧角色切换 -->
  <header class="w-full px-5 sm:px-8 py-4 flex items-center justify-between relative z-10 gap-3">
    <div class="flex items-center space-x-2.5 min-w-0">
      <img src="assets/logo-xinghuo.jpg" alt="星火伴学" width="40" height="40" class="xh-brand-logo w-10 h-10 shrink-0 ring-2 ring-white/70" />
      <div class="min-w-0">
        <div class="flex items-center gap-2">
          <span class="font-black text-slate-900 text-base tracking-tight leading-none">星火学伴</span>
          <span class="text-[10px] bg-brand-500/20 text-brand-600 px-1.5 py-0.5 rounded font-mono">AUTH</span>
        </div>
        <span class="text-[10px] text-slate-500 font-medium truncate block">阳光合规课辅 · 智能共享空间</span>
      </div>
    </div>

    <!-- 角色切换：右上角紧凑分段控件 -->
    <div id="roleSwitchBar" class="flex items-center gap-0.5 p-0.5 rounded-full bg-white/80 backdrop-blur-md border border-brand-blush/40 shadow-bubble shrink-0" role="tablist" aria-label="登录角色">
      <button type="button" id="tabParent" onclick="switchRole('parent')" class="px-2.5 sm:px-3 py-1.5 rounded-full text-[11px] sm:text-xs font-semibold transition-all flex items-center gap-1 text-slate-600 hover:text-slate-900 cursor-pointer" role="tab" aria-selected="false">
        <i class="fa-solid fa-user-group text-[10px] opacity-70"></i>
        <span class="hidden xs:inline sm:inline">家长学员端</span>
        <span class="sm:hidden">家长</span>
      </button>
      <button type="button" id="tabMentor" onclick="switchRole('mentor')" class="px-2.5 sm:px-3 py-1.5 rounded-full text-[11px] sm:text-xs font-semibold transition-all flex items-center gap-1 bg-brand-500 text-white shadow-sm cursor-pointer" role="tab" aria-selected="true">
        <i class="fa-solid fa-chalkboard-user text-[10px] text-white"></i>
        <span class="hidden xs:inline sm:inline">导师端</span>
        <span class="sm:hidden">导师</span>
      </button>
    </div>
  </header>

  <main class="w-full max-w-md mx-auto px-4 py-4 sm:py-8 relative z-10 flex-1 flex flex-col justify-center">
    <!-- 无边框、强融合背景的半透明面板 -->
    <div class="xh-card rounded-3xl p-6 sm:p-8 space-y-5 transition-all">

      <!-- 动态标题说明 -->
      <div class="space-y-1">
        <h1 id="roleTitle" class="text-xl font-black text-slate-900 tracking-tight">青年导师端登录</h1>
        <p id="roleSubtitle" class="text-xs text-slate-600 leading-relaxed">
          银行合约直达秒结 · 阳光透明接单授课
        </p>
      </div>

      <!-- 登录表单：显式设置 action 规避 iframe 相对路径解析异常 -->
      <form id="loginForm" action="javascript:void(0);" onsubmit="event.preventDefault(); handleLoginSubmit(event); return false;" class="space-y-4">

        <!-- 手机号输入 -->
        <div>
          <label class="block text-xs font-bold text-slate-200/90 mb-1.5">手机号码</label>
          <div class="relative">
            <div class="absolute left-3.5 top-1/2 -translate-y-1/2 flex items-center gap-1 text-slate-500 text-xs font-bold pr-2 select-none">
              <span>+86</span>
            </div>
            <input type="tel" id="loginMobile" required maxlength="11" placeholder="例：138****8000（入库登记或预留手机号）" class="field-soft w-full text-sm pl-14 pr-3.5 py-2.5 rounded-xl border-0 focus:outline-none focus:ring-2 focus:ring-brand-400/60 transition font-medium text-slate-800 placeholder:text-slate-500/70">
          </div>
        </div>

        <!-- 登录方式一：短信验证码（默认免密优先） -->
        <div id="codeLoginSection" class="space-y-1.5">
          <label class="block text-xs font-bold text-slate-200/90">短信验证码</label>
          <div class="flex gap-2">
            <div class="relative flex-1">
              <i class="fa-solid fa-key absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
              <input type="text" id="smsCodeInput" maxlength="6" placeholder="请输入 6 位短信验证码" class="field-soft w-full text-sm pl-9 pr-3 py-2.5 rounded-xl border-0 focus:outline-none focus:ring-2 focus:ring-brand-400/60 transition font-mono tracking-wider text-slate-800 placeholder:text-slate-500/70">
            </div>
            <button type="button" id="btnSendCode" onclick="sendSmsCode()" class="shrink-0 bg-brand-50 hover:bg-brand-100 border border-brand-blush/50 active:scale-95 text-brand-700 text-xs font-bold px-3.5 py-2.5 rounded-xl transition cursor-pointer backdrop-blur-sm">
              获取验证码
            </button>
          </div>
          <div id="smsDemoHint" class="text-[10px] text-slate-400 flex items-center gap-1 pt-0.5">
            <i class="fa-solid fa-circle-info text-brand-400"></i>
            <span id="smsDemoHintText">请先获取短信验证码；演示环境部分账号可使用测试码（以发送成功提示为准）</span>
          </div>
        </div>

        <!-- 登录方式二：账户密码（默认隐藏，点击切换呼出） -->
        <div id="pwdLoginSection" class="space-y-1.5 hidden">
          <label class="block text-xs font-bold text-slate-200/90">登录密码</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
            <input type="password" id="passwordInput" placeholder="请输入您的账户密码" class="field-soft w-full text-sm pl-9 pr-10 py-2.5 rounded-xl border-0 focus:outline-none focus:ring-2 focus:ring-brand-400/60 transition text-slate-800 placeholder:text-slate-500/70">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-700 cursor-pointer">
              <i class="fa-solid fa-eye-slash text-xs" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <!-- 登录方式切换链接与忘记密码 -->
        <div class="flex items-center justify-between text-xs pt-0.5">
          <button type="button" id="toggleLoginModeBtn" onclick="toggleLoginMode()" class="text-brand-600 hover:text-brand-700 font-semibold flex items-center gap-1 transition cursor-pointer">
            <i class="fa-solid fa-rotate text-[10px]"></i>
            <span id="toggleLoginModeText">改用账号密码登录</span>
          </button>
          <button type="button" onclick="showToast('请联系平台教研客服或使用免密短信重置')" class="text-slate-400 hover:text-slate-200 transition cursor-pointer">
            忘记密码？
          </button>
        </div>

        <!-- 合规知情授权勾选 -->
        <div class="pt-1">
          <label class="flex items-start gap-2 text-xs text-slate-400 cursor-pointer select-none">
            <input type="checkbox" id="agreementCheckbox" class="w-3.5 h-3.5 mt-0.5 rounded text-brand-600 focus:ring-brand-500 border-0 bg-white/40">
            <span class="text-[11px] leading-tight text-slate-300">
              已阅读并同意
              <button type="button" onclick="openServiceAgreement(event)" class="text-brand-600 underline font-medium cursor-pointer p-0 bg-transparent border-none">《服务协议》</button>
              与
              <button type="button" onclick="openPrivacyPolicy(event)" class="text-brand-600 underline font-medium cursor-pointer p-0 bg-transparent border-none">《个人信息保护政策》</button>
            </span>
          </label>
        </div>

        <!-- 提交登录按钮 -->
        <button type="submit" id="btnSubmitLogin" class="w-full bg-brand-500 hover:bg-brand-600 active:scale-[0.99] text-white text-sm font-bold py-3 rounded-xl shadow-lg shadow-brand-500/25 transition flex items-center justify-center gap-2 cursor-pointer">
          <span>安全登录</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>

        <!-- 跳转失败时的手动进入兜底 -->
        <div id="manualEnterFallback" class="hidden mt-2 text-center">
          <p class="text-[11px] text-amber-200/90 bg-amber-500/15 rounded-xl px-3 py-2 mb-2">
            页面未自动跳转？请点击下方手动进入
          </p>
          <a id="manualEnterLink" href="#" class="inline-flex items-center gap-1.5 text-sm font-bold text-brand-700 hover:text-brand-600 bg-brand-500/20 hover:bg-brand-500/30 px-4 py-2 rounded-xl transition">
            <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
            <span>手动进入</span>
          </a>
        </div>

      </form>

      <!-- 底部入驻指引（无分割线） -->
      <div id="registerPromptBox" class="pt-2 flex items-center justify-between text-xs gap-2">
        <span class="text-slate-400 shrink-0">还未通过资质核验？</span>
        <button type="button" onclick="safeNavigate('index.html', '导师认证与建库 (L1/L2)')" class="font-bold text-brand-700 hover:text-brand-600 flex items-center gap-1 bg-white/90 hover:bg-white border border-brand-blush/40 px-3 py-1.5 rounded-lg transition cursor-pointer">
          <span>进入导师认证与建库 (L1/L2)</span>
          <i class="fa-solid fa-angle-right text-[10px]"></i>
        </button>
      </div>

    </div>

    <!-- 底部合规说明 -->
    <div class="mt-5 text-center text-xs text-slate-400 space-y-1">
      <div class="flex items-center justify-center gap-3 flex-wrap">
        <span class="flex items-center gap-1">
          <i class="fa-solid fa-shield-check text-brand-400"></i>
          公安与学信网实名直连
        </span>
        <span class="text-slate-600">·</span>
        <span class="flex items-center gap-1">
          <i class="fa-solid fa-building-columns text-brand-400"></i>
          商业银行托管专户
        </span>
      </div>
    </div>
  </main>

  <!-- 极简页脚 -->
  <footer class="w-full py-4 text-center text-[11px] text-slate-500 relative z-10">
    <p>© 2026 星火学伴 · 阳光课业辅导匹配与智能微空间生态系统</p>
  </footer>

  <!-- 浮动通知 Toast 组件 -->
  <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-md text-white px-5 py-3 rounded-2xl shadow-2xl text-xs flex items-center gap-2.5 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-4">
    <i class="fa-solid fa-circle-info text-brand-400 text-sm" id="toastIcon"></i>
    <span id="toastMessage">已更新状态</span>
  </div>

    <script src="js/config.js"></script>
    <script src="js/feature-flags.js"></script>
    <script src="js/storage-service.js"></script>
    <script src="js/legal-docs.js"></script>

    <script>
    // 统一库 hydrate：页面脚本可 await StorageService.ready()
    (function () {
      if (window.StorageService && StorageService.hydrateFromServer) {
        StorageService.hydrateFromServer();
      }
    })();
    </script>

<script>
    'use strict';

    let currentRole = 'mentor';
    let isCodeMode = true;
    let countdown = 0;
    let timerInterval = null;

    // 安全路由跳转：优先 location.assign / location.href，并暴露手动进入兜底
    let pendingNavUrl = null;
    let pendingNavWatch = null;

    const ROLE_TAB_ACTIVE = "px-2.5 sm:px-3 py-1.5 rounded-full text-[11px] sm:text-xs font-semibold transition-all flex items-center gap-1 bg-brand-500 text-white shadow-sm cursor-pointer";
    const ROLE_TAB_IDLE = "px-2.5 sm:px-3 py-1.5 rounded-full text-[11px] sm:text-xs font-semibold transition-all flex items-center gap-1 text-slate-600 hover:text-slate-900 cursor-pointer";

    function showManualEnterFallback(targetUrl) {
      const box = document.getElementById('manualEnterFallback');
      const link = document.getElementById('manualEnterLink');
      if (!box || !link || !targetUrl) return;
      pendingNavUrl = targetUrl;
      link.href = targetUrl;
      link.onclick = function(e) {
        e.preventDefault();
        try { window.location.href = targetUrl; } catch (_) {}
        try { window.location.assign(targetUrl); } catch (_) {}
      };
      box.classList.remove('hidden');
    }

    function safeNavigate(targetUrl, targetTitle) {
      if (!targetUrl || typeof targetUrl !== 'string' || !targetUrl.trim()) return;
      pendingNavUrl = targetUrl.trim();
      showToast(`正在跳转至【${targetTitle || targetUrl}】...`);
      try {
        window.location.assign(pendingNavUrl);
      } catch (e) {
        console.warn('location.assign failed:', e);
        try { window.location.href = pendingNavUrl; } catch (e2) {
          console.warn('location.href failed:', e2);
        }
      }
      // 若 2.5s 后仍停留在登录页，展示「手动进入」
      if (pendingNavWatch) clearTimeout(pendingNavWatch);
      pendingNavWatch = setTimeout(() => {
        const stillHere = /login\.html/i.test(window.location.pathname || '') ||
          (window.location.href || '').indexOf('login.html') !== -1 ||
          document.getElementById('btnSubmitLogin');
        if (stillHere && pendingNavUrl) {
          showManualEnterFallback(pendingNavUrl);
          showToast('自动跳转未完成，请点击「手动进入」', 'warning');
        }
      }, 2500);
    }

    // 切换家长 / 导师 / 管理端角色（右上角分段控件）
    function switchRole(role) {
      currentRole = role;
      const tabMentor = document.getElementById('tabMentor');
      const tabParent = document.getElementById('tabParent');
      const roleTitle = document.getElementById('roleTitle');
      const roleSubtitle = document.getElementById('roleSubtitle');
      const regBox = document.getElementById('registerPromptBox');

      tabMentor.className = ROLE_TAB_IDLE;
      tabParent.className = ROLE_TAB_IDLE;
      tabMentor.setAttribute('aria-selected', 'false');
      tabParent.setAttribute('aria-selected', 'false');

      if (role === 'mentor') {
        tabMentor.className = ROLE_TAB_ACTIVE;
        tabMentor.setAttribute('aria-selected', 'true');
        roleTitle.innerText = "青年导师端登录";
        roleSubtitle.innerText = window.getLoginRoleSubtitle
          ? window.getLoginRoleSubtitle('mentor')
          : '银行合约直达秒结 · 阳光透明接单授课';
        regBox.innerHTML = `
          <span class="text-slate-400 shrink-0">还未通过资质核验？</span>
          <button type="button" onclick="safeNavigate('index.html', '导师认证与建库 (L1/L2)')" class="font-bold text-brand-700 hover:text-brand-600 flex items-center gap-1 bg-white/90 hover:bg-white border border-brand-blush/40 px-3 py-1.5 rounded-lg transition cursor-pointer">
            <span>进入导师认证与建库 (L1/L2)</span>
            <i class="fa-solid fa-angle-right text-[10px]"></i>
          </button>
        `;
      } else {
        tabParent.className = ROLE_TAB_ACTIVE;
        tabParent.setAttribute('aria-selected', 'true');
        roleTitle.innerText = "家长 / 学员登录";
        roleSubtitle.innerText = window.getLoginRoleSubtitle
          ? window.getLoginRoleSubtitle('parent')
          : '单次约课零预付 · 优选双一流学霸导师';
        regBox.innerHTML = `
          <span class="text-slate-400 shrink-0">首次约课辅导？</span>
          <button type="button" onclick="safeNavigate('parent_register.html', '学情建档与注册')" class="font-bold text-brand-700 hover:text-brand-600 flex items-center gap-1 bg-white/90 hover:bg-white border border-brand-blush/40 px-3 py-1.5 rounded-lg transition cursor-pointer">
            <span>前往学情建档注册</span>
            <i class="fa-solid fa-angle-right text-[10px]"></i>
          </button>
        `;
      }
    }

    // 切换验证码 / 密码登录模式
    function toggleLoginMode() {
      isCodeMode = !isCodeMode;
      const codeSec = document.getElementById('codeLoginSection');
      const pwdSec = document.getElementById('pwdLoginSection');
      const toggleText = document.getElementById('toggleLoginModeText');

      if (isCodeMode) {
        codeSec.classList.remove('hidden');
        pwdSec.classList.add('hidden');
        toggleText.innerText = "改用账号密码登录";
      } else {
        codeSec.classList.add('hidden');
        pwdSec.classList.remove('hidden');
        toggleText.innerText = "改用短信免密登录";
      }
    }

    // 切换密码明文/密文可见性
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('passwordInput');
      const eyeIcon = document.getElementById('eyeIcon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.className = "fa-solid fa-eye text-xs text-brand-600";
      } else {
        pwdInput.type = 'password';
        eyeIcon.className = "fa-solid fa-eye-slash text-xs text-slate-400";
      }
    }

    // 发送验证码（调用 API）
    async function sendSmsCode() {
      const mobile = document.getElementById('loginMobile').value.trim();
      if (!/^1[3-9]\d{9}$/.test(mobile)) {
        showToast('请输入有效的 11 位手机号码！', 'warning');
        return;
      }
      if (countdown > 0) return;

      const btn = document.getElementById('btnSendCode');
      btn.disabled = true;
      btn.innerText = '发送中...';

      try {
        const apiBase = window.XH_CONFIG?.API_BASE || 'http://127.0.0.1:8787';
        const response = await fetch(`${apiBase}/api/auth/sms/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: mobile, scene: 'login' })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          countdown = 60;
          btn.innerText = `${countdown}s 重发`;
          btn.className = "shrink-0 bg-white/10 text-slate-500 text-xs font-bold px-3.5 py-2.5 rounded-xl cursor-not-allowed backdrop-blur-sm";

          timerInterval = setInterval(() => {
            countdown--;
            if (countdown > 0) {
              btn.innerText = `${countdown}s 重发`;
            } else {
              clearInterval(timerInterval);
              btn.disabled = false;
              btn.innerText = "获取验证码";
              btn.className = "shrink-0 bg-brand-50 hover:bg-brand-100 border border-brand-blush/50 active:scale-95 text-brand-700 text-xs font-bold px-3.5 py-2.5 rounded-xl transition cursor-pointer backdrop-blur-sm";
            }
          }, 1000);

          const hintEl = document.getElementById('smsDemoHint');
          const hintText = document.getElementById('smsDemoHintText');
          if (result.requiresRealCode) {
            if (hintText) hintText.textContent = '该手机号需使用短信中的真实验证码登录';
            if (hintEl) hintEl.classList.remove('hidden');
          } else if (result.provider === 'mock' && result.message && !String(result.message).includes('888888')) {
            if (hintText) hintText.textContent = result.message;
          } else if (result.provider === 'mock') {
            if (hintText) hintText.innerHTML = '演示环境可使用测试验证码（见发送提示）';
          }
          const msg = result.message || (result.provider === 'mock'
            ? '短信验证码已发送'
            : '短信验证码已发送，请查收');
          showToast(msg);
        } else {
          btn.disabled = false;
          btn.innerText = "获取验证码";
          showToast(result.error || '发送失败，请稍后重试', 'error');
        }
      } catch (error) {
        console.error('SMS send error:', error);
        btn.disabled = false;
        btn.innerText = "获取验证码";
        // 降级到本地 mock
        countdown = 60;
        btn.disabled = true;
        btn.innerText = `${countdown}s 重发`;
        btn.className = "shrink-0 bg-white/10 text-slate-500 text-xs font-bold px-3.5 py-2.5 rounded-xl cursor-not-allowed backdrop-blur-sm";
        timerInterval = setInterval(() => {
          countdown--;
          if (countdown > 0) {
            btn.innerText = `${countdown}s 重发`;
          } else {
            clearInterval(timerInterval);
            btn.disabled = false;
            btn.innerText = "获取验证码";
            btn.className = "shrink-0 bg-brand-50 hover:bg-brand-100 border border-brand-blush/50 active:scale-95 text-brand-700 text-xs font-bold px-3.5 py-2.5 rounded-xl transition cursor-pointer backdrop-blur-sm";
          }
        }, 1000);
        showToast('API 连接失败，请检查网络后重试', 'warning');
      }
    }

    // 提交登录逻辑
    async function resolvePostLoginTargetAsync(user) {
      console.log('[resolvePostLoginTargetAsync] user:', user);
      
      if (user.role === 'admin') {
        return { url: 'admin-saas/index.html', title: '星火运营中台' };
      }
      if (user.role === 'mentor') {
        try {
          const mentors = await StorageService.getMentors();
          console.log('[resolvePostLoginTargetAsync] mentors:', mentors.length, 'total');
          // Use userId instead of phone since phone is masked in the user object
          const mentor = mentors.find(m => m.id === user.id);
          console.log('[resolvePostLoginTargetAsync] found mentor:', mentor ? mentor.id : 'none');
          if (mentor && mentor.status === 'approved') {
            return { url: 'mentor_dashboard.html', title: '导师工作台' };
          }
        } catch (e) {
          console.warn('Failed to fetch mentors:', e);
        }
        return { url: 'index.html', title: '导师入库招募页' };
      }
      try {
        const parents = await StorageService.getParents();
        console.log('[resolvePostLoginTargetAsync] parents:', parents.length, 'total');
        console.log('[resolvePostLoginTargetAsync] looking for user.id:', user.id);
        // Use userId instead of phone since phone is masked in the user object
        const hasProfile = parents.some(p => p.id === user.id);
        console.log('[resolvePostLoginTargetAsync] hasProfile:', hasProfile);
        if (hasProfile) {
          return { url: 'parent_dashboard.html', title: '家长主控与智能匹配' };
        }
      } catch (e) {
        console.warn('Failed to fetch parents:', e);
      }
      return { url: 'parent_register.html', title: '学情建档与注册' };
    }

    function handleLoginSubmit(event) {
      if (event && event.preventDefault) {
        event.preventDefault();
      }

      const mobile = document.getElementById('loginMobile').value.trim();
      const agreed = document.getElementById('agreementCheckbox').checked;
      const fallbackBox = document.getElementById('manualEnterFallback');
      if (fallbackBox) fallbackBox.classList.add('hidden');

      if (!mobile) {
        showToast('请先输入手机号！', 'warning');
        return;
      }
      if (!agreed) {
        showToast('请阅读并勾选服务协议与隐私政策！', 'warning');
        return;
      }

      const submitBtn = document.getElementById('btnSubmitLogin');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i><span>验证中...</span>';

      if (isCodeMode) {
        const code = document.getElementById('smsCodeInput').value.trim();
        if (!code || code.length !== 6) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>安全登录</span><i class="fa-solid fa-arrow-right text-xs"></i>';
          showToast('请输入 6 位短信验证码！', 'error');
          return;
        }

        // 验证 SMS 验证码（调用 API）
        (async () => {
          try {
            // Step 1: 验证短信码获取票据
            const verifyResult = await StorageService.verifySMS(mobile, code, 'login');
            
            if (!verifyResult.success) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = '<span>安全登录</span><i class="fa-solid fa-arrow-right text-xs"></i>';
              showToast(verifyResult.error || '验证码错误，请重试', 'error');
              return;
            }

            const ticket = verifyResult.ticket;
            if (!ticket) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = '<span>安全登录</span><i class="fa-solid fa-arrow-right text-xs"></i>';
              showToast('验证成功但未获取到票据，请重试', 'error');
              return;
            }

            // Step 2: 使用票据登录
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i><span>登录中...</span>';
            const loginResult = await StorageService.login(ticket, currentRole);

            if (!loginResult.success) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = '<span>安全登录</span><i class="fa-solid fa-arrow-right text-xs"></i>';
              showToast(loginResult.error || '登录失败，请重试', 'error');
              return;
            }

            // Step 3: 登录成功，hydrate数据，确定跳转目标
            const user = loginResult.user;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i><span>加载数据...</span>';
            
            // Hydrate from server to get latest data
            try {
              await StorageService.hydrateFromServer();
            } catch (e) {
              console.warn('Hydration failed, using local data:', e);
            }
            
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i><span>登录成功，正在进入...</span>';
            const roleLabel = user.role === 'mentor' ? '导师工作台' : (user.role === 'admin' ? '管理审核台' : '预约中心');
            showToast(`欢迎回来！正在进入${roleLabel}...`);

            // 异步获取跳转目标
            const target = await resolvePostLoginTargetAsync(user);
            pendingNavUrl = target.url;

            // 预填手动进入链接
            const link = document.getElementById('manualEnterLink');
            if (link) {
              link.href = target.url;
              link.onclick = function(e) {
                e.preventDefault();
                try { window.location.href = target.url; } catch (_) {}
                try { window.location.assign(target.url); } catch (_) {}
              };
            }

            setTimeout(() => {
              try {
                window.location.assign(target.url);
              } catch (e1) {
                try { window.location.href = target.url; } catch (e2) {
                  console.warn('explicit navigate failed', e2);
                }
              }
            }, 350);

            // 若约 2.5s 后仍停留在登录页，展示「手动进入」并恢复按钮
            if (pendingNavWatch) clearTimeout(pendingNavWatch);
            pendingNavWatch = setTimeout(() => {
              submitBtn.disabled = false;
              submitBtn.innerHTML = '<span>安全登录</span><i class="fa-solid fa-arrow-right text-xs"></i>';
              showManualEnterFallback(target.url);
              showToast('自动跳转未完成，请点击「手动进入」', 'warning');
            }, 2500);
          } catch (error) {
            console.error('Login error:', error);
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>安全登录</span><i class="fa-solid fa-arrow-right text-xs"></i>';
            showToast(error.message || '登录失败，请重试', 'error');
          }
        })();
        return; // 异步处理，不继续执行下面的代码
      }

      // 密码模式或其他模式（保持原逻辑）
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-xs"></i><span>安全验证通过，正在进入...</span>';

      const roleLabel = currentRole === 'mentor' ? '导师工作台' : (currentRole === 'admin' ? '管理审核台' : '预约中心');
      showToast(`欢迎回来！正在进入${roleLabel}...`);

      const mobileVal = mobile;
      const target = resolvePostLoginTarget(mobileVal);
      pendingNavUrl = target.url;

      // 预填手动进入链接（隐藏），验证通过后显式导航
      const link = document.getElementById('manualEnterLink');
      if (link) {
        link.href = target.url;
        link.onclick = function(e) {
          e.preventDefault();
          try { window.location.href = target.url; } catch (_) {}
          try { window.location.assign(target.url); } catch (_) {}
        };
      }

      setTimeout(() => {
        try {
          window.location.assign(target.url);
        } catch (e1) {
          try { window.location.href = target.url; } catch (e2) {
            console.warn('explicit navigate failed', e2);
          }
        }
      }, 350);

      // 若约 2.5s 后仍停留在登录页，展示「手动进入」并恢复按钮
      if (pendingNavWatch) clearTimeout(pendingNavWatch);
      pendingNavWatch = setTimeout(() => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>安全登录</span><i class="fa-solid fa-arrow-right text-xs"></i>';
        showManualEnterFallback(target.url);
        showToast('自动跳转未完成，请点击「手动进入」', 'warning');
      }, 2500);
    }

    // 自定义轻量 Toast 提示组件
    let toastTimer = null;
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toastNotification');
      const toastText = document.getElementById('toastMessage');
      const toastIcon = document.getElementById('toastIcon');

      toastText.innerText = message;
      if (type === 'error') {
        toastIcon.className = "fa-solid fa-circle-xmark text-rose-400 text-sm";
      } else if (type === 'warning') {
        toastIcon.className = "fa-solid fa-triangle-exclamation text-amber-400 text-sm";
      } else {
        toastIcon.className = "fa-solid fa-circle-check text-brand-400 text-sm";
      }

      toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2600);
    }

    if (window.getLoginRoleSubtitle) {
      const rs = document.getElementById('roleSubtitle');
      if (rs) rs.innerText = window.getLoginRoleSubtitle(currentRole);
    }
  </script>
