<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>星火运营中台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/xh-motion.css">
  <script src="../js/xh-motion.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .admin-nav-group { padding: 10px 12px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #64748b; }
    .admin-nav a { font-weight: 500; }
    table.admin-dense th, table.admin-dense td { padding: 0.5rem 0.75rem; font-size: 13px; }
    .admin-nav a { position: relative; transition: background-color .2s, color .2s, padding-left .25s cubic-bezier(0.22, 1, 0.36, 1); }
    .admin-nav a.bg-teal-600 { padding-left: 1.1rem; box-shadow: 0 6px 16px rgba(22, 107, 86, 0.35); }
    .admin-nav a.bg-teal-600::before { content: ""; position: absolute; left: 0.45rem; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%; background: #f2b544; box-shadow: 0 0 8px #f2b544; }
    html.xh-motion #adminMain.xh-route-in > * { animation: xh-rise .45s var(--xh-ease-out) backwards; }
    @media (max-width: 1023px) {
      #adminSidebar { position: fixed; inset: 0 auto 0 0; z-index: 55; height: 100%; translate: -100% 0; transition: translate .35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow .35s ease; }
      body.admin-nav-open #adminSidebar { translate: 0 0; box-shadow: 20px 0 40px rgba(15, 23, 42, 0.25); }
      body.admin-nav-open #adminNavBackdrop { opacity: 1; pointer-events: auto; }
    }
    #adminNavBackdrop { position: fixed; inset: 0; z-index: 54; background: rgba(15, 23, 42, 0.5); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
    @media (min-width: 1024px) { #adminNavBackdrop, #adminNavToggle { display: none; } }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">
  <div class="flex min-h-screen">
    <aside id="adminSidebar" class="w-56 bg-slate-900 text-slate-200 flex flex-col shrink-0 border-r border-slate-800">
      <div class="p-4 border-b border-slate-800">
        <div class="flex items-center gap-2">
          <img src="../assets/brand/spark-logo-forest-noface-192.png" alt="" width="32" height="32" class="w-8 h-8 rounded-full object-cover" decoding="async" />
          <div>
            <div class="font-semibold text-white text-sm leading-tight">星火运营中台</div>
            <div class="text-xs text-slate-500">星火学伴 · 管理端</div>
          </div>
        </div>
      </div>
      <nav class="admin-nav flex-1 p-2 space-y-0.5 text-sm overflow-y-auto">
        <div class="admin-nav-group">核心审核与风控</div>
        <a href="#dashboard" data-nav="dashboard" class="block px-3 py-1.5 rounded text-slate-300 hover:bg-slate-800">总览</a>
        <a href="#audit" data-nav="audit" class="block px-3 py-1.5 rounded text-slate-300 hover:bg-slate-800">导师审核</a>
        <a href="#payments" data-nav="payments" class="block px-3 py-1.5 rounded text-slate-300 hover:bg-slate-800">支付与退款</a>
        <a href="#feedback" data-nav="feedback" class="block px-3 py-1.5 rounded text-slate-300 hover:bg-slate-800">反馈投诉</a>
        <div class="admin-nav-group">用户与履约</div>
        <a href="#bookings" data-nav="bookings" class="block px-3 py-1.5 rounded text-slate-300 hover:bg-slate-800">预约订单</a>
        <a href="#parents" data-nav="parents" class="block px-3 py-1.5 rounded text-slate-300 hover:bg-slate-800">家长用户</a>
        <a href="#mentors" data-nav="mentors" class="block px-3 py-1.5 rounded text-slate-300 hover:bg-slate-800">导师用户</a>
        <a href="#contracts" data-nav="contracts" class="block px-3 py-1.5 rounded text-slate-300 hover:bg-slate-800">合约</a>
        <a href="#assessments" data-nav="assessments" class="block px-3 py-1.5 rounded text-slate-300 hover:bg-slate-800">学情测评</a>
        <div class="admin-nav-group">空间与底座</div>
        <a href="#teaching-points" data-nav="teaching-points" class="block px-3 py-1.5 rounded text-slate-300 hover:bg-slate-800">教学点仓位</a>
        <a href="#system" data-nav="system" class="block px-3 py-1.5 rounded text-slate-300 hover:bg-slate-800">系统开关</a>
        <a href="#permissions" data-nav="permissions" class="block px-3 py-1.5 rounded text-slate-300 hover:bg-slate-800">权限设置</a>
      </nav>
      <div class="p-3 border-t border-slate-800 text-xs">
        <div class="text-slate-500 mb-2" id="adminUserLabel">管理员</div>
        <button type="button" id="btnLogout" class="w-full text-left px-3 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-slate-200">退出登录</button>
      </div>
    </aside>
    <div id="adminNavBackdrop" aria-hidden="true"></div>
    <div class="flex-1 flex flex-col min-w-0">
      <header id="adminTopBar" class="shrink-0 bg-white border-b border-slate-200 px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-3">
        <button type="button" id="adminNavToggle" class="shrink-0 w-9 h-9 rounded-xl border border-slate-200 text-slate-700 flex items-center justify-center" aria-label="打开导航" aria-controls="adminSidebar" aria-expanded="false">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2 min-w-0">
            <span id="adminSessionStatus" class="shrink-0 text-xs font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">正在确认</span>
            <div id="adminIdentity" class="text-sm font-semibold text-slate-900 truncate">正在确认登录身份…</div>
          </div>
          <div id="adminSessionNote" class="hidden text-xs text-rose-700 mt-1"></div>
        </div>
        <a id="adminRelogin" data-admin-relogin href="../login.html" class="hidden shrink-0 text-sm bg-rose-600 text-white px-3 py-2 rounded-xl font-bold">重新登录中台</a>
      </header>
      <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto" id="adminMain">
        <p class="text-slate-500">加载中…</p>
      </main>
    </div>
  </div>
  <div id="adminToast" class="hidden fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-lg text-sm font-medium bg-slate-900 text-white">
    <span id="adminToastText"></span>
  </div>
  <div id="bookingDetailModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="bookingDetailTitle">
    <button type="button" id="bookingDetailBackdrop" class="absolute inset-0 bg-slate-900/55" aria-label="关闭"></button>
    <div class="relative bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-3xl max-h-[90vh] overflow-hidden flex flex-col">
      <div class="flex items-center justify-between gap-3 px-5 py-4 border-b border-slate-100 shrink-0">
        <h2 id="bookingDetailTitle" class="text-lg font-semibold text-slate-900">预约详情</h2>
        <button type="button" id="bookingDetailClose" class="text-slate-500 hover:text-slate-800 p-2 rounded-lg hover:bg-slate-100" aria-label="关闭">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="bookingDetailBody" class="overflow-y-auto px-5 py-4 text-sm"></div>
    </div>
  </div>
  <div id="adminConfirmModal" class="hidden fixed inset-0 z-[70] flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="adminConfirmTitle">
    <button type="button" id="adminConfirmBackdrop" class="absolute inset-0 bg-slate-900/55" aria-label="取消"></button>
    <div class="relative bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md p-5 space-y-4">
      <h2 id="adminConfirmTitle" class="text-lg font-semibold text-slate-900">确认删除</h2>
      <p id="adminConfirmMessage" class="text-sm text-slate-600 leading-relaxed"></p>
      <div class="flex justify-end gap-2">
        <button type="button" id="adminConfirmCancel" class="px-4 py-2 rounded-xl text-sm font-bold border border-slate-200 text-slate-700">取消</button>
        <button type="button" id="adminConfirmOk" class="px-4 py-2 rounded-xl text-sm font-bold bg-rose-600 text-white">确认删除</button>
      </div>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/xh-loading.js"></script>
  <script src="../js/storage-service.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/admin-api.js"></script>
  <script src="js/admin-app.js"></script>
  <script>
    (function () {
      var toggle = document.getElementById('adminNavToggle');
      var backdrop = document.getElementById('adminNavBackdrop');
      function setOpen(open) {
        document.body.classList.toggle('admin-nav-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      toggle.addEventListener('click', function () { setOpen(!document.body.classList.contains('admin-nav-open')); });
      backdrop.addEventListener('click', function () { setOpen(false); });
      document.getElementById('adminSidebar').addEventListener('click', function (e) {
        if (e.target.closest('[data-nav]')) setOpen(false);
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
    })();
  </script>
</body>
</html>
