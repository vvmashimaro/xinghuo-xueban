    function showToast(message, type) {
      const toast = document.getElementById('toastNotification');
      const icon = document.getElementById('toastIcon');
      const msg = document.getElementById('toastMessage');
      if (!toast) return;
      msg.textContent = message;
      if (type === 'warning') icon.className = 'fa-solid fa-triangle-exclamation text-amber-400';
      else if (type === 'error') icon.className = 'fa-solid fa-circle-xmark text-rose-400';
      else icon.className = 'fa-solid fa-circle-check text-teal-400';
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
      }, 2800);
    }

      location.href = 'parent_dashboard.html';

    function resolveGradeContext(parent) {
      const grade = (parent && parent.studentGrade) || '';
      currentGradeBand = (StorageService && StorageService.gradeBandFromGrade)
        ? StorageService.gradeBandFromGrade(grade)
        : '初中';
      currentGradeLabel = (StorageService && StorageService.shortGradeLabel)
        ? StorageService.shortGradeLabel(grade)
        : (grade.split(/[\s(（]/)[0] || '学员');
    }

    function getQuizQuestions(subject) {
      const band = QUIZ_BANK[currentGradeBand] || QUIZ_BANK['初中'] || {};
      let qs = band[subject];
      if (!qs || !qs.length) {
        // 回退：同学科其他学段 → 初中题库
        qs = (QUIZ_BANK['初中'] && QUIZ_BANK['初中'][subject]) || [];
      }
      return qs || [];
    }

    function getSubjectTabs() {
      let subjects = availableSubjects;
      if (!subjects || !subjects.length) {
        if (StorageService && StorageService.resolveAssessmentSubjectsForParent) {
          subjects = StorageService.resolveAssessmentSubjectsForParent(CURRENT_PARENT);
        } else {
          subjects = (StorageService && StorageService.ASSESSMENT_SUBJECTS) || ['数学', '英语', '物理', '化学'];
        }
      }
      return subjects;
    }

    function parseQuery() {
      const q = new URLSearchParams(location.search);
      fromTrial = q.get('from') === 'trial';
      const sub = (window.StorageService && StorageService.normalizeAssessmentSubject)
        ? StorageService.normalizeAssessmentSubject(q.get('subject') || '')
        : (q.get('subject') || '');
      if (sub) currentSubject = sub;
    }

    function renderTabs() {
      const box = document.getElementById('subjectTabs');
      const subjects = getSubjectTabs();
      // 试课传入学科若不在已选列表，仍并入 tabs，保证 gate 可测
      if (currentSubject && subjects.indexOf(currentSubject) < 0) {
        subjects.push(currentSubject);
      }
      if (subjects.indexOf(currentSubject) < 0) currentSubject = subjects[0] || '数学';
      box.innerHTML = subjects.map((s) => {
        const active = s === currentSubject;
        const done = CURRENT_PARENT && StorageService.hasAssessment(CURRENT_PARENT.id || CURRENT_PARENT.phone, s);
        return '<button type="button" onclick="selectSubject(\'' + s + '\')" class="rounded-xl border px-3 py-2.5 text-sm font-bold transition cursor-pointer ' +
          (active ? 'bg-teal-600 text-white border-teal-600 shadow-md shadow-teal-600/20' : 'bg-white text-slate-700 border-slate-200 hover:border-teal-400') + '">' +
          s + (done ? ' <span class="text-[10px] opacity-80">✓</span>' : '') + '</button>';
      }).join('');
    }

    function selectSubject(s) {
      currentSubject = s;
      document.getElementById('resultPanel').classList.add('hidden');
      renderTabs();
      renderPrior();
      renderQuiz();
    }

    function renderPrior() {
      const el = document.getElementById('priorResult');
      if (!CURRENT_PARENT || !StorageService) { el.classList.add('hidden'); return; }
      const a = StorageService.getAssessment(CURRENT_PARENT.id || CURRENT_PARENT.phone, currentSubject);
      if (!a) { el.classList.add('hidden'); return; }
      el.classList.remove('hidden');
      const title = currentGradeLabel + ' · ' + currentSubject;
      el.innerHTML = '已有「' + title + '」测评：<strong>' + a.score + ' 分 · ' + a.level + '</strong>（' + (a.completedAt || '') + '）。可重新作答覆盖。';
    }

    function quizTitleText() {
      return currentGradeLabel + ' · ' + currentSubject;
    }

    function renderQuiz() {
      const qs = getQuizQuestions(currentSubject);
      document.getElementById('quizPanel').classList.remove('hidden');
      document.getElementById('quizSubjectTitle').textContent = quizTitleText();
      document.getElementById('quizProgress').textContent = '共 ' + qs.length + ' 题 · ' + currentGradeBand;
      document.getElementById('quizBar').style.width = '0%';
      const box = document.getElementById('questionsBox');
      if (!qs.length) {
        box.innerHTML = '<p class="text-sm text-slate-500">暂无该学段题库，请更换学科或完善年级资料。</p>';
        return;
      }
      box.innerHTML = qs.map((item, i) => {
        const opts = item.options.map((opt, j) =>
          '<label class="q-opt flex items-center gap-2 border border-slate-200 rounded-xl px-3 py-2 text-[13px] cursor-pointer hover:border-teal-400 transition">' +
            '<input type="radio" name="q' + i + '" value="' + j + '" class="accent-teal-600" onchange="updateProgress()">' +
            '<span>' + opt + '</span></label>'
        ).join('');
        return '<div class="space-y-2" data-qi="' + i + '">' +
          '<div class="text-[13px] font-bold text-slate-800"><span class="text-teal-700 mr-1">' + (i + 1) + '.</span>' + item.q + '</div>' +
          '<div class="grid sm:grid-cols-2 gap-1.5">' + opts + '</div></div>';
      }).join('');
    }

    function updateProgress() {
      const qs = getQuizQuestions(currentSubject);
      let answered = 0;
      qs.forEach((_, i) => {
        if (document.querySelector('input[name="q' + i + '"]:checked')) answered++;
      });
      document.getElementById('quizProgress').textContent = answered + ' / ' + qs.length + ' · ' + currentGradeBand;
      document.getElementById('quizBar').style.width = (qs.length ? (answered / qs.length * 100) : 0) + '%';
    }

    function submitQuiz() {
      const qs = getQuizQuestions(currentSubject);
      let correct = 0;
      let answered = 0;
      qs.forEach((item, i) => {
        const sel = document.querySelector('input[name="q' + i + '"]:checked');
        if (sel) {
          answered++;
          if (parseInt(sel.value, 10) === item.a) correct++;
        }
      });
      if (answered < qs.length) {
        showToast('还有 ' + (qs.length - answered) + ' 题未作答', 'warning');
        return;
      }
      const score = Math.round((correct / qs.length) * 100);
      const level = StorageService.scoreToLevel(score);
      const parent = CURRENT_PARENT || StorageService.getCurrentParent();
      const record = StorageService.saveAssessment({
        subject: currentSubject,
        score: score,
        level: level,
        gradeBand: currentGradeBand,
        studentGrade: parent && parent.studentGrade,
        parentId: parent && parent.id,
        parentPhone: parent && parent.phone,
        studentId: parent && parent.id,
        studentNickname: parent && parent.studentNickname,
        totalQuestions: qs.length,
        correctCount: correct
      });
      document.getElementById('quizPanel').classList.add('hidden');
      document.getElementById('resultPanel').classList.remove('hidden');
      document.getElementById('resultSubject').textContent = quizTitleText();
      document.getElementById('resultScore').textContent = String(score);
      document.getElementById('resultLevel').textContent = level;
      document.getElementById('resultTime').textContent = '完成于 ' + (record && record.completedAt ? record.completedAt : '') + ' · ' + currentGradeBand + '题库';
      renderTabs();
      renderPrior();
      showToast('「' + quizTitleText() + '」测评已保存 · ' + score + '分 · ' + level);
    }

    function restartQuiz() {
      document.getElementById('resultPanel').classList.add('hidden');
      renderQuiz();
    }

    async function boot() {
      parseQuery();
      if (window.StorageService && StorageService.ready) {
        try { await StorageService.ready(); } catch (_) {}
      }
      CURRENT_PARENT = StorageService.getCurrentParent();
      resolveGradeContext(CURRENT_PARENT);
      availableSubjects = (StorageService && StorageService.resolveAssessmentSubjectsForParent)
        ? StorageService.resolveAssessmentSubjectsForParent(CURRENT_PARENT)
        : null;
      const hint = document.getElementById('studentHint');
      if (hint && CURRENT_PARENT) {
        const nick = CURRENT_PARENT.studentNickname || CURRENT_PARENT.parentName || '家长用户';
        hint.textContent = '学员：' + nick + ' · ' + currentGradeLabel + '（' + currentGradeBand + '）';
      }
      if (fromTrial) {
        document.getElementById('trialGateBanner').classList.remove('hidden');
      }
      renderTabs();
      renderPrior();
      renderQuiz();
    }

    boot();
  </script>
  </script>
</body>
</html>
